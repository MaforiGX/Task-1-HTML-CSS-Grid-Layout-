<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid</title>

<style>
    .grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        grid-template-rows: 100px 90px 90px;
        gap: 10px;
        max-width: 600px;
        margin: 30px auto;
    }

    .box {
        border: 2px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
    }
    
    .a {
        grid-column: 1 / 4;
        grid-row: 1
    }

    .b {
        grid-column: 1 / 3;
        grid-row: 2;
    }

    .c {
        grid-column: 1;
        grid-row: 3;
    }

    .d {
        grid-column: 2;
        grid-row: 3;
    }

    .e {
        grid-column: 3;
        grid-row: 2 / 4;
    }

     @media (max-width: 768px) {
        .grid {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60 px 70px 40px 60px;
        }

        .a {
        grid-column: 1 / 3;
        grid-row: 1
      }

        .b {
        grid-column: 1 / 3;
        grid-row: 2;
      }

        .c {
        grid-column: 1;
        grid-row: 3;
      }

        .d {
        grid-column: 2;
        grid-row: 3;
      }

        .e {
        grid-column: 1 / 3;
        grid-row: 4;
      }
     }

</style>
</head>

<body>

<div class="grid">
    <div class="box a">A</div>
    <div class="box b">B</div>
    <div class="box c">C</div>
    <div class="box d">D</div>
    <div class="box e">E</div>
</div>

</body>
</html>
